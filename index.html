<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f9f7"><title>ElektroVizsga – erősáramú elektrotechnikus</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f8f9f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
main{max-width:820px;margin:auto;padding:26px 18px 70px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px;padding-bottom:19px;border-bottom:1px solid #e2e5e0}
.brand{font-size:1.36rem;font-weight:780;letter-spacing:-.045em;color:#171918}
.brand span{color:#171918}
.tag{font-size:.75rem;font-weight:650;color:#575d59;border:1px solid #e0e3df;background:#fff;border-radius:100px;padding:7px 11px}
.panel{background:#fff;border:1px solid #e3e6e2;border-radius:20px;padding:clamp(20px,4vw,32px);margin:16px 0;box-shadow:0 3px 17px rgba(18,27,20,.035)}
.muted{color:#686e6a}
h1{font-size:clamp(1.85rem,5vw,2.75rem);line-height:1.16;letter-spacing:-.045em;margin:13px 0 18px;font-weight:760}
h2{line-height:1.3;letter-spacing:-.025em}
p{line-height:1.65}
.pill{display:inline-block;background:#f5f3e8;color:#55501c;border:1px solid #ece6cb;padding:7px 12px;border-radius:100px;font-size:.8rem;font-weight:650}
.button{background:#222523;color:#fff;padding:13px 19px;border:1px solid #222523;border-radius:12px;font-weight:700;font-size:.96rem;cursor:pointer;transition:background .15s ease,transform .15s ease}
.button:hover:not(:disabled){background:#3a3d3b}
.button.secondary{background:#fff;color:#262927;border:1px solid #dbdfda}
.button.secondary:hover:not(:disabled){background:#f4f5f2}
.button:focus-visible,.option:focus-visible,select:focus-visible{outline:3px solid #e5bf44;outline-offset:3px}
.button:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.option{width:100%;text-align:left;display:flex;gap:15px;align-items:center;padding:15px;margin:10px 0;border:1px solid #e0e4df;background:#fff;color:#252825;border-radius:13px;font-size:1rem;cursor:pointer;transition:border-color .14s ease,background .14s ease}
.option:hover{border-color:#a6aaa5;background:#fafbf9}
.option strong{background:#f1f3f0;color:#3c433d;padding:9px 12px;border-radius:9px;min-width:38px;text-align:center}
.option.selected{border-color:#c7a531;background:#fff9e7}
.option.selected strong{background:#f6dc77;color:#29241b}
.progress{height:8px;background:#ecefeb;border-radius:8px;overflow:hidden;margin:20px 0}
.progress>div{height:100%;background:#d5a829;transition:width .2s}
.stats{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}
.stat strong{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.small{font-size:.88rem}
.answer{border-top:1px solid #e7e9e5;padding:17px 0}
mark{background:#fff1b9;color:#37301c;padding:3px 6px;border-radius:5px}
.bad{color:#b6382b}
.good{color:#177245}
footer{color:#787f7a;font-size:.78rem;margin-top:30px;line-height:1.6}
label{display:block;margin:12px 0;font-weight:600}
select{border:1px solid #d5d9d3;color:#202420;background:#fff;border-radius:10px;padding:12px;font-size:1rem;max-width:100%;min-height:44px}
header:after{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(120deg,#e8c431 0 17px,#212321 17px 30px)}
@media(max-width:550px){main{padding:24px 14px 50px}.panel{border-radius:17px}.actions .button{flex:1 1 auto}header{margin-bottom:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head><body><main><header><div class="brand">⚡ Elektro<span>Vizsga</span></div><div class="tag">DEMO • 1.0</div></header><div id="app"></div><footer>Gyakorlóalkalmazás, nem hivatalos vizsgafelület. A mintakérdések saját szerkesztésűek, nem OSZTV-feladatok.</footer></main>
<script src="questions-extra.js"></script>
<script>
"use strict";
const BANK=[
{id:"n1",topic:"Villamos hálózatok",q:"Egy 230 V feszültségre kapcsolt, 46 Ω ellenállású fogyasztón mekkora áram folyik?",opts:["0,2 A","5 A","10 A","46 A"],a:1,why:"Ohm törvénye alapján I = U/R = 230/46 = 5 A."},
{id:"n2",topic:"Villamos hálózatok",q:"Ideális, szimmetrikus háromfázisú 400/230 V hálózatban mekkora a fázisfeszültség?",opts:["230 V","400 V","690 V","133 V"],a:0,why:"Csillagkapcsolásban U_f = U_v/√3, így 400/√3 ≈ 230 V."},
{id:"n3",topic:"Villamos hálózatok",q:"Két 100 Ω-os ellenállást párhuzamosan kapcsolunk. Mennyi az eredő?",opts:["200 Ω","100 Ω","50 Ω","25 Ω"],a:2,why:"Két azonos ellenállás párhuzamos eredője R/2 = 50 Ω."},
{id:"g1",topic:"Villamos gépek és fogyasztók",q:"Mi a transzformátor alapvető működési elve?",opts:["Elektromágneses indukció","Elektrolízis","Termoelektromos hatás","Piezoelektromos hatás"],a:0,why:"A primer tekercs változó mágneses fluxusa feszültséget indukál a szekunder tekercsben."},
{id:"g2",topic:"Villamos gépek és fogyasztók",q:"Mit jelent az aszinkronmotor szlipje?",opts:["A forgórész és a forgómező fordulatszámának relatív eltérését","A névleges teljesítmény és a veszteség összegét","A fázisok közötti feszültséget","A motor tekercsének ohmos ellenállását"],a:0,why:"A szlip s = (n_s − n)/n_s, ahol n_s a szinkron, n a forgórész fordulatszáma."},
{id:"g3",topic:"Villamos gépek és fogyasztók",q:"Egy 2 kW teljesítményű, állandó teljesítményen üzemelő fűtőtest 3 óra alatt mennyi energiát fogyaszt?",opts:["0,67 kWh","5 kWh","6 kWh","9 kWh"],a:2,why:"E = P·t = 2 kW · 3 h = 6 kWh."},
{id:"b1",topic:"Villamos biztonságtechnika",q:"Milyen célra szolgál a PE-vezető?",opts:["Üzemi áram vezetésére normál üzemben","Védőösszekötésre és hibavédelmi célra","A feszültség frekvenciájának szabályozására","A fogyasztás mérésére"],a:1,why:"A PE védővezető, normál üzemben nem rendeltetésszerű üzemi áramvezető."},
{id:"b2",topic:"Villamos biztonságtechnika",q:"Mit érzékel az áram-védőkapcsoló (ÁVK) alapvetően?",opts:["A hálózati frekvencia eltérését","A fázisvezetők felmelegedését","Az átvezetett áramok előjeles összegének eltérését","A csatlakozó teljesítményt"],a:2,why:"Az ÁVK az átvezetett vezetők áramainak eredőjét figyeli: eltérő oda- és visszafolyó áram esetén működhet."},
{id:"b3",topic:"Villamos biztonságtechnika",q:"Melyik jelölés utal a védővezetőre villamos rajzon?",opts:["N","L1","PE","PEN kizárólag"],a:2,why:"A PE a védővezető; a PEN egyesített védő- és nullavezető."},
{id:"b4",topic:"Villamos biztonságtechnika",q:"Melyik eszköz alkalmas önmagában túláram elleni védelemre megfelelő méretezés esetén?",opts:["ÁVK túláramvédelem nélkül","Kismegszakító","Egyszerű kapcsoló","Jelzőlámpa"],a:1,why:"A kismegszakító túlterhelés és zárlati túláram ellen is véd; a szokásos ÁVK önmagában nem túláramvédelmi eszköz."}
];
BANK.push(...EXTRA_BANK);
const app=document.getElementById("app");
let state={mode:"home",order:[],cursor:0,answers:{},skipped:[],second:false,deadline:0,timer:null,topic:"Összes témakör"};
const escaped=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const storageKey="elektrovizsga-last-result";
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function home(){stopTimer();state.mode="home";const last=JSON.parse(localStorage.getItem(storageKey)||"null");app.innerHTML='<section class="panel"><span class="pill">Erősáramú elektrotechnikus</span><h1>Készülj a februári interaktív vizsgára!</h1><p class="muted">A–B–C–D válaszok, kérdésenként egyszeri átugrás, részletes kiértékelés. Az adatbank jelenleg "+BANK.length+" saját készítésű gyakorlókérdést tartalmaz, köztük OSZTV-témák és a befotózott füzet alapján készülteket.</p><label for="topic">Gyakorlás témaköre</label><select id="topic"><option>Összes témakör</option>'+[...new Set(BANK.map(q=>q.topic))].map(t=>'<option>'+escaped(t)+'</option>').join('')+'</select><div class="actions"><button class="button" id="start">45 perces próba indítása</button></div></section>'+(last?'<section class="panel"><h2>Legutóbbi eredmény</h2><p><strong>'+last.score+'/'+last.total+'</strong> helyes válasz ('+Math.round(last.score/last.total*100)+'%)</p></section>':'');document.getElementById("start").onclick=()=>start(document.getElementById("topic").value)}
function start(topic){stopTimer();let order=BANK.filter(q=>topic==="Összes témakör"||q.topic===topic).map(q=>q.id);order=order.sort(()=>Math.random()-.5);state={mode:"exam",order,cursor:0,answers:{},skipped:[],second:false,deadline:Date.now()+45*60*1000,timer:null,topic};state.timer=setInterval(tick,1000);render()}
function tick(){if(state.mode!=="exam")return;if(Date.now()>=state.deadline){finish();return}const el=document.getElementById("clock");if(el)el.textContent=clock()}
function clock(){const sec=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function current(){return BANK.find(q=>q.id===state.order[state.cursor])}
function render(){if(state.mode!=="exam")return;let q=current();if(!q){if(!state.second&&state.skipped.length){state.second=true;state.order=state.skipped.slice();state.cursor=0;q=current()}else{return finish()}}if(!q)return finish();const n=state.order.length;app.innerHTML='<section class="panel"><div class="stats"><div class="stat"><span class="muted small">'+(state.second?"Második kör":"Első kör")+'</span><strong>'+(state.cursor+1)+' / '+n+'</strong></div><div class="stat"><span class="muted small">Hátralévő idő</span><strong id="clock">'+clock()+'</strong></div></div><div class="progress"><div style="width:'+Math.round((state.cursor)/n*100)+'%"></div></div><span class="pill">'+escaped(q.topic)+'</span><p class="muted small">'+escaped(q.source||"Alapozó mintafeladat")+'</p><h2>'+escaped(q.q)+'</h2><div id="options">'+q.opts.map((o,i)=>'<button class="option" data-a="'+i+'"><strong>'+String.fromCharCode(65+i)+'</strong><span>'+escaped(o)+'</span></button>').join('')+'</div><div class="actions"><button class="button secondary" id="skip" '+(state.second?"disabled":"")+'>Átugrom egyszer</button><button class="button secondary" id="end">Vizsga befejezése</button></div><p class="muted small">'+(state.second?"Ezeket a kérdéseket már nem lehet átugrani.":"Az átugrott kérdések a végén újra megjelennek.")+'</p></section>';document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(q.id,Number(b.dataset.a)));document.getElementById("skip").onclick=()=>skip(q.id);document.getElementById("end").onclick=()=>{if(confirm("Biztosan befejezed a próbavizsgát?"))finish()}}
function answer(id,a){state.answers[id]=a;state.cursor++;render()}
function skip(id){if(state.second)return;state.skipped.push(id);state.cursor++;render()}
function finish(){stopTimer();state.mode="results";const selected=BANK.filter(q=>state.topic==="Összes témakör"||q.topic===state.topic);const score=selected.reduce((sum,q)=>sum+(state.answers[q.id]===q.a?1:0),0);localStorage.setItem(storageKey,JSON.stringify({score,total:selected.length,date:new Date().toISOString()}));const groups=[...new Set(selected.map(q=>q.topic))];app.innerHTML='<section class="panel"><span class="pill">Próba lezárva</span><h1>'+score+' / '+selected.length+' pont</h1><p class="muted">'+Math.round(score/selected.length*100)+'% helyes válasz. A meg nem válaszolt kérdések hibásnak számítanak.</p><h2>Témakörönként</h2>'+groups.map(t=>{let qs=selected.filter(q=>q.topic===t);let good=qs.filter(q=>state.answers[q.id]===q.a).length;return '<p>'+escaped(t)+': <strong>'+good+'/'+qs.length+'</strong></p>'}).join('')+'<div class="actions"><button class="button" id="again">Új gyakorlás</button></div></section><section class="panel"><h2>Megoldások és magyarázatok</h2>'+selected.map((q,i)=>'<div class="answer"><p><strong>'+(i+1)+'. '+escaped(q.q)+'</strong></p><p class="muted small">'+escaped(q.source||"Alapozó mintafeladat")+'</p><p class="'+(state.answers[q.id]===q.a?"good":"bad")+'">Válaszod: '+(state.answers[q.id]===undefined?"kimaradt":String.fromCharCode(65+state.answers[q.id]))+' · Helyes: '+String.fromCharCode(65+q.a)+'</p><p><mark>'+escaped(q.opts[q.a])+'</mark></p><p class="muted">'+escaped(q.why)+'</p></div>').join('')+'</section>';document.getElementById("again").onclick=home}
home();
</script></body></html>
