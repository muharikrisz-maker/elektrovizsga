<style>

"use strict";
const BANK=[
{id:"n1",topic:"Villamos hálózatok",q:"Egy 230 V feszültségre kapcsolt, 46 Ω ellenállású fogyasztón mekkora áram folyik?",opts:["0,2 A","5 A","10 A","46 A"],a:1,why:"Ohm törvénye alapján I = U/R = 230/46 = 5 A."},
{id:"n2",topic:"Villamos hálózatok",q:"Ideális, szimmetrikus háromfázisú 400/230 V hálózatban mekkora a fázisfeszültség?",opts:["230 V","400 V","690 V","133 V"],a:0,why:"Csillagkapcsolásban U_f = U_v/√3, így 400/√3 ≈ 230 V."},
{id:"n3",topic:"Villamos hálózatok",q:"Két 100 Ω-os ellenállást párhuzamosan kapcsolunk. Mennyi az eredő?",opts:["200 Ω","100 Ω","50 Ω","25 Ω"],a:2,why:"Két azonos ellenállás párhuzamos eredője R/2 = 50 Ω."},
{id:"g1",topic:"Villamos gépek és fogyasztók",q:"Mi a transzformátor alapvető működési elve?",opts:["Elektromágneses indukció","Elektrolízis","Termoelektromos hatás","Piezoelektromos hatás"],a:0,why:"A primer tekercs változó mágneses fluxusa feszültséget indukál a szekunder tekercsben."},
{id:"g2",topic:"Villamos gépek és fogyasztók",q:"Mit jelent az aszinkronmotor szlipje?",opts:["A forgórész és a forgómező fordulatszámának relatív eltérését","A névleges teljesítmény és a veszteség összegét","A fázisok közötti feszültséget","A motor tekercsének ohmos ellenállását"],a:0,why:"A szlip s = (n_s − n)/n_s, ahol n_s a szinkron, n a forgórész fordulatszáma."},
{id:"g3",topic:"Villamos gépek és fogyasztók",q:"Egy 2 kW teljesítményű, állandó teljesítményen üzemelő fűtőtest 3 óra alatt mennyi energiát fogyaszt?",opts:["0,67 kWh","5 kWh","6 kWh","9 kWh"],a:2,why:"E = P·t = 2 kW · 3 h = 6 kWh."},
{id:"b1",topic:"Villamos biztonságtechnika",q:"Milyen célra szolgál a PE-vezető?",opts:["Üzemi áram vezetésére normál üzemben","Védőösszekötésre és hibavédelmi célra","A feszültség frekvenciájának szabályozására","A fogyasztás mérésére"],a:1,why:"A PE védővezető, normál üzemben nem rendeltetésszerű üzemi áramvezető."},
{id:"b2",topic:"Villamos biztonságtechnika",q:"Mit érzékel az áram-védőkapcsoló (ÁVK) alapvetően?",opts:["A hálózati frekvencia eltérését","A fázisvezetők felmelegedését","Az átvezetett áramok előjeles összegének eltérését","A csatlakozó teljesítményt"],a:2,why:"Az ÁVK az átvezetett vezetők áramainak eredőjét figyeli: eltérő oda- és visszafolyó áram esetén működhet."},
{id:"b3",topic:"Villamos biztonságtechnika",q:"Melyik jelölés utal a védővezetőre villamos rajzon?",opts:["N","L1","PE","PEN kizárólag"],a:2,why:"A PE a védővezető; a PEN egyesített védő- és nullavezető."},
{id:"b4",topic:"Villamos biztonságtechnika",q:"Melyik eszköz alkalmas önmagában túláram elleni védelemre megfelelő méretezés esetén?",opts:["ÁVK túláramvédelem nélkül","Kismegszakító","Egyszerű kapcsoló","Jelzőlámpa"],a:1,why:"A kismegszakító túlterhelés és zárlati túláram ellen is véd; a szokásos ÁVK önmagában nem túláramvédelmi eszköz."}
];
BANK.push(...EXTRA_BANK,...PRACTICAL_BANK,...OKTAV_BANK);
const topicByQuestion=new Map();
for(const t of EXAM_FRAMEWORK.topics)for(const id of t.questionIds)topicByQuestion.set(id,t.id);
function learningTopicOf(q){return EXAM_FRAMEWORK.topics.find(t=>t.id===q.learningTopic)||null}
for(const q of BANK){
 const m=TEACHING_MATERIALS[q.id],t=EXAM_FRAMEWORK.topics.find(x=>x.id===topicByQuestion.get(q.id));
 q.learningTopic=t?.id||q.topic;
 if(m)Object.assign(q,m);
 q.intro||=t?.intro||"Gondold végig a feladatban szereplő mennyiségek kapcsolatát.";
 q.hint||="Először azonosítsd az ismert adatokat és a keresett mennyiséget.";
 q.worked||=t?.example||"A témakör további feladataival gyakorolhatod az összefüggést.";
 q.real||=t?.intro||"A tananyagban szereplő összefüggések a gyakorlati méréseknél is hasznosak.";
 q.why||=t?.intro||"A témakörben tanult összefüggést alkalmazzuk.";
}
const app=document.getElementById("app");
let state={mode:"home",order:[],cursor:0,answers:{},skipped:[],second:false,deadline:0,timer:null,topic:"Összes témakör"};
const escaped=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const storageKey="elektrovizsga-last-result";
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function home(){stopTimer();state.mode="home";const user=window.ElektroAuth?.getUser();app.innerHTML='<section class="panel"><span class="pill">Erősáramú elektrotechnikus</span><h1>Próbavizsga és személyes tanulás</h1><p class="muted">45 perc, 20 kérdés, '+BANK.length+' saját készítésű gyakorlókérdés.</p><label for="topic">Gyakorlás témaköre</label><select id="topic"><option>Összes témakör</option>'+[...new Set(BANK.map(q=>q.topic))].map(t=>'<option>'+escaped(t)+'</option>').join('')+'</select><div class="actions"><button class="button" id="start">Próbavizsga indítása</button><button class="button secondary" id="startStudy">Tanulási segéd · szintek</button></div><p class="muted small">'+(user?'Bejelentkezve: az eredmény mentésre kerül, ha a szolgáltatás elérhető.':'Vendégként nem tárolunk eredményelőzményeket.')+'</p></section><section class="panel"><span class="pill">Tanulói fiók</span><h2>'+ (user?'Bejelentkezve: '+escaped(user.email||'tanuló'):'Személyes tanulás e-maillel')+'</h2><p class="muted">Eredmények, napi, heti, havi statisztikák, gyengébb témakörök.</p><div class="actions"><button class="button secondary" id="account">'+(user?'Statisztikáim':'Belépés e-maillel')+'</button>'+(user?'<button class="button secondary" id="profile">Felhasználónevem</button><button class="button secondary" id="logout">Kijelentkezés</button>':'')+'</div></section>';document.getElementById("start").onclick=()=>start(document.getElementById("topic").value);document.getElementById("startStudy").onclick=studyHome;document.getElementById("account").onclick=()=>user?showDashboard():showLogin();if(user)document.getElementById("profile").onclick=showProfile;if(user)document.getElementById("logout").onclick=async()=>{try{await window.ElektroAuth.signOut();home()}catch(e){alert(e.message)}}}
async function showProfile(){stopTimer();state.mode="profile";const user=window.ElektroAuth?.getUser();if(!user){showLogin();return}app.innerHTML='<section class="panel"><span class="pill">Tanulói profil</span><h1>Felhasználónév</h1><p class="muted">A belépés továbbra is az e-mail-címeddel működik. Itt állíthatod be az egyedi megjelenített nevedet.</p><p class="muted small">Belépve: '+escaped(user.email||"")+'</p><form id="profileForm"><label for="profileName">Felhasználónév</label><input id="profileName" class="auth-input" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" autocomplete="nickname" placeholder="pelda_felhasznalo" required><p class="muted small">3–24 karakter; angol betűk, számok, aláhúzás. Minden név egyedi.</p><div class="actions"><button class="button" type="submit">Felhasználónév mentése</button><button class="button secondary" id="cancelProfile" type="button">Vissza</button></div></form><p id="profileStatus" role="status"></p></section>';document.getElementById("cancelProfile").onclick=home;document.getElementById("profileForm").onsubmit=async e=>{e.preventDefault();const status=document.getElementById("profileStatus");status.textContent="Mentés…";try{const name=await window.ElektroAuth.saveUsername(document.getElementById("profileName").value);status.textContent="A felhasználóneved elmentve: "+name}catch(err){status.textContent="Nem sikerült menteni: "+err.message}};try{const profile=await window.ElektroAuth.getProfile();if(profile&&state.mode==="profile"){document.getElementById("profileName").value=profile.username;document.getElementById("profileStatus").textContent="Jelenlegi felhasználónév: "+profile.username}}catch(err){if(state.mode==="profile")document.getElementById("profileStatus").textContent="A profil még nincs beállítva: "+err.message}}
function showLogin(){stopTimer();state.mode="login";const ready=window.ElektroAuth?.available();app.innerHTML='<section class="panel"><span class="pill">Tanulói fiók</span><h1>Bejelentkezés e-maillel</h1><p class="muted">Egyszer használatos belépési linket küldünk, jelszó nélkül.</p>'+(ready?'<form id="loginForm"><label for="loginEmail">E-mail-cím</label><input class="auth-input" type="email" id="loginEmail" autocomplete="email" placeholder="nev@pelda.hu" required><div class="actions"><button class="button" type="submit">Belépési link küldése</button></div></form><p id="loginStatus" role="status"></p>':'<p class="auth-note">A belépés felülete elkészült, de a Supabase-projekt még nincs összekötve, ezért e-mailt egyelőre nem tudunk küldeni.</p>')+'<button class="button secondary" id="backHome">Vissza</button></section>';document.getElementById("backHome").onclick=home;if(ready)document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const el=document.getElementById("loginStatus");el.textContent="Küldés…";try{await window.ElektroAuth.sendLink(document.getElementById("loginEmail").value.trim());el.textContent="Ellenőrizd az e-mail-fiókodat!"}catch(error){el.textContent="Hiba: "+error.message}}}
async function showDashboard(){stopTimer();state.mode="dashboard";const user=window.ElektroAuth?.getUser();if(!user){showLogin();return}app.innerHTML='<section class="panel"><h1>Tanulási statisztikák</h1><p class="muted">'+escaped(user.email||"")+'</p><p id="profileLabel" class="muted small">Felhasználónév betöltése…</p><p id="statsStatus">Betöltés…</p><div id="statsBody"></div><button class="button secondary" id="backHome">Vissza</button></section>';document.getElementById("backHome").onclick=home;window.ElektroAuth.getProfile().then(p=>{if(state.mode==="dashboard"){document.getElementById("profileLabel").textContent=p?.username?"Felhasználónév: "+p.username:"Még nincs felhasználónév beállítva."}}).catch(()=>{if(state.mode==="dashboard")document.getElementById("profileLabel").textContent="A felhasználónév még nem érhető el."});try{const history=await window.ElektroAuth.history();if(state.mode!=="dashboard")return;document.getElementById("statsStatus").textContent=history.length?'Mentett vizsgák: '+history.length:'Még nincs mentett vizsgád.';const now=Date.now();const windows=[["Mai",1],["Heti",7],["Havi",30]];const cards=windows.map(([label,days])=>{const found=history.filter(x=>new Date(x.created_at).getTime()>=now-days*86400000);const correct=found.reduce((n,x)=>n+x.score,0),total=found.reduce((n,x)=>n+x.total,0);return '<div class="metric"><span>'+label+' · '+found.length+' teszt</span><strong>'+(total?Math.round(100*correct/total)+'%':'—')+'</strong></div>'}).join('');const topics={};for(const attempt of history){for(const [id,value] of Object.entries(attempt.answers||{})){const q=BANK.find(x=>x.id===id);if(!q)continue;const stats=topics[q.topic]??={correct:0,total:0};stats.total++;if(value===q.a)stats.correct++}}const topicRows=Object.entries(topics).map(([t,v])=>'<p>'+escaped(t)+': <strong>'+Math.round(100*v.correct/v.total)+'%</strong> ('+v.total+' kérdés)</p>').join('');document.getElementById("statsBody").innerHTML='<div class="metrics">'+cards+'</div><h2>Témakörök</h2>'+(topicRows||'<p>Még nincs adat.</p>')}catch(error){if(state.mode==="dashboard")document.getElementById("statsStatus").textContent="Adatbetöltési hiba: "+error.message}}


let ohmCurrent=null;
async function showOhmPractice(){
 stopTimer();state.mode="ohm-practice";
 const user=window.ElektroAuth?.getUser();
 if(!user){app.innerHTML='<section class="panel"><span class="pill">Ohm-törvény · önálló gyakorlás</span><h1>Jelentkezz be a gyakorláshoz</h1><p>A feladatokat a tanulói fiókodhoz mentjük, ezért nem kapsz kétszer ugyanolyan számítási feladatot.</p><div class="actions"><button class="button" id="ohmLogin">Bejelentkezés</button><button class="button secondary" id="ohmBack">Vissza</button></div></section>';document.getElementById("ohmLogin").onclick=showLogin;document.getElementById("ohmBack").onclick=home;return}
 app.innerHTML='<section class="panel"><span class="pill">Tanulószoba · Ohm-törvény</span><h1>Önálló számítás</h1><p class="muted">Nincsenek válaszlehetőségek. Számold ki az eredményt és írd be az értékét! A megoldást csak a válaszod után mutatjuk meg.</p><p id="ohmStatus" role="status">Új feladat készítése…</p><div id="ohmContent"></div><div class="actions"><button class="button secondary" id="ohmBack">Vissza</button></div></section>';
 document.getElementById("ohmBack").onclick=home;
 try{
   const q=await window.ElektroGenerator.next();
   if(state.mode!=="ohm-practice")return;
   ohmCurrent=q;
   document.getElementById("ohmStatus").textContent="Új, korábban nem kapott feladat";
   document.getElementById("ohmContent").innerHTML='<h2>'+escaped(q.q)+'</h2><form id="ohmForm"><label for="ohmAnswer">A válaszod ('+escaped(q.unit)+')</label><input class="auth-input" id="ohmAnswer" type="text" inputmode="decimal" autocomplete="off" placeholder="Például: 5,25" required><p class="muted small">A tizedesvessző és a tizedespont egyaránt használható.</p><div class="actions"><button class="button" id="ohmSubmit" type="submit">Ellenőrzés</button></div></form><div id="ohmFeedback" role="status"></div>';
   document.getElementById("ohmForm").onsubmit=async e=>{
     e.preventDefault();
     const input=document.getElementById("ohmAnswer").value.trim().replace(/\s/g,"").replace(",",".");
     if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(input)){document.getElementById("ohmFeedback").textContent="Írj be egy számot, mértékegység nélkül.";return}
     const val=Number(input);
     const submit=document.getElementById("ohmSubmit");submit.disabled=true;
     try{
       const result=await window.ElektroGenerator.submit(q,input);
       const correct=result.correct;
       if(state.mode!=="ohm-practice"||ohmCurrent?.id!==q.id)return;
       const shownAnswer=document.getElementById("ohmAnswer").value;document.getElementById("ohmForm").remove();
       document.getElementById("ohmFeedback").innerHTML='<div class="study-feedback"><h2 class="'+(correct?"good":"bad")+'">'+(correct?"Helyes!":"Ezt még gyakoroljuk.")+'</h2><p>Válaszod: '+escaped(shownAnswer)+' '+escaped(q.unit)+'</p><p><strong>Helyes eredmény: '+escaped(new Intl.NumberFormat("hu-HU",{maximumFractionDigits:2}).format(q.answer))+' '+escaped(q.unit)+'</strong></p><p>'+escaped(q.why)+'</p><button class="button" id="nextOhm">Következő, új feladat</button></div>';

function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
// Each attempt gets independent answer positions. Stored answers remain original
// option indexes so grading and historical progress stay accurate.
function varyQuestions(questions){return questions.map(q=>window.ElektroVariations?.vary(q)||{...q})}
function optionOrder(q,orders){return orders[q.id]??(orders[q.id]=shuffled(q.opts.map((_,i)=>i)))}
function displayedLetter(q,originalIndex,orders){if(originalIndex===undefined)return "kimaradt";const pos=optionOrder(q,orders).indexOf(originalIndex);return pos<0?"—":String.fromCharCode(65+pos)}
function start(topic){stopTimer();let questions;if(topic==="Összes témakör"){const quotas=[["Villamos hálózatok",6],["Villamos gépek és fogyasztók",6],["Villamos biztonságtechnika",8]];questions=quotas.flatMap(([name,count])=>shuffled(BANK.filter(q=>q.topic===name)).slice(0,count));if(questions.length!==20){alert("Nincs még elegendő kérdés a 20 kérdéses próbavizsgához.");return}}else{questions=shuffled(BANK.filter(q=>q.topic===topic)).slice(0,20)}questions=varyQuestions(questions);const selectedIds=questions.map(q=>q.id);const order=shuffled(selectedIds);state={mode:"exam",examQuestions:questions,order,selectedIds,cursor:0,answers:{},skipped:[],second:false,deadline:Date.now()+45*60*1000,timer:null,topic,optionOrders:{}};state.timer=setInterval(tick,1000);render()}
function tick(){if(state.mode!=="exam")return;if(Date.now()>=state.deadline){finish();return}const el=document.getElementById("clock");if(el)el.textContent=clock()}
function clock(){const sec=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function current(){return (state.examQuestions||BANK).find(q=>q.id===state.order[state.cursor])}
function render(){if(state.mode!=="exam")return;let q=current();if(!q){if(!state.second&&state.skipped.length){state.second=true;state.order=state.skipped.slice();state.cursor=0;q=current()}else{return finish()}}if(!q)return finish();const n=state.order.length;app.innerHTML='<section class="panel"><div class="stats"><div class="stat"><span class="muted small">'+(state.second?"Második kör":"Első kör")+'</span><strong>'+(state.cursor+1)+' / '+n+'</strong></div><div class="stat"><span class="muted small">Hátralévő idő</span><strong id="clock">'+clock()+'</strong></div></div><div class="progress"><div style="width:'+Math.round((state.cursor)/n*100)+'%"></div></div><span class="pill">'+escaped(q.topic)+'</span><p class="muted small">'+escaped(q.source||"Alapozó mintafeladat")+'</p><h2>'+escaped(q.q)+'</h2><div id="options">'+optionOrder(q,state.optionOrders).map((originalIndex,i)=>'<button class="option" data-a="'+originalIndex+'"><strong>'+String.fromCharCode(65+i)+'</strong><span>'+escaped(q.opts[originalIndex])+'</span></button>').join('')+'</div><div class="actions"><button class="button secondary" id="skip" '+(state.second?"disabled":"")+'>Átugrom egyszer</button><button class="button secondary" id="end">Vizsga befejezése</button></div><p class="muted small">'+(state.second?"Ezeket a kérdéseket már nem lehet átugrani.":"Az átugrott kérdések a végén újra megjelennek.")+'</p></section>';document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(q.id,Number(b.dataset.a)));document.getElementById("skip").onclick=()=>skip(q.id);document.getElementById("end").onclick=()=>{if(confirm("Biztosan befejezed a próbavizsgát?"))finish()}}

 const score=selected.filter(q=>study.answers[q.id]===q.a).length;
 const missed=selected.filter(q=>study.answers[q.id]!==q.a);
 const percent=Math.round(100*score/selected.length);
 const recomm=missed.length?missed.reduce((m,q)=>{const k=q.learningTopic;m[k]=(m[k]||0)+1;return m},{}):{};
 const sorted=Object.entries(recomm).sort((a,b)=>b[1]-a[1]);
 app.innerHTML='<section class="panel"><span class="pill">Tanulási kör lezárva</span><h1>'+score+' / '+selected.length+' jó válasz · '+percent+'%</h1><p class="muted">'+(percent>=80?'Szép eredmény! Megpróbálhatsz egy nehezebb szintet.':'Érdemes ismételni azokat a témákat, ahol hibáztál. A magyarázatokból már láthatod, mire kell figyelni.')+'</p>'+(missed.length?'<h2>Amit érdemes újra megnézned</h2>'+sorted.map(([k,n])=>'<p><strong>'+escaped(EXAM_FRAMEWORK.topics.find(t=>t.id===k)?.title||k)+'</strong> · '+n+' hibás válasz</p>').join(''):'<h2>Minden kérdés sikerült!</h2>')+'<p id="studySaveStatus" class="muted small">'+(window.ElektroAuth?.getUser()?'Mentés folyamatban…':'Vendégként ezt a gyakorlást nem mentjük el.')+'</p><div class="actions"><button class="button" id="studyRetry">Új gyakorlás</button><button class="button secondary" id="studyHome">Szintválasztás</button>'+(study.mode==="level"&&study.level<2&&percent>=80?'<button class="button secondary" id="studyAdvance">Következő szint</button>':'')+'</div></section>';
 document.getElementById("studyRetry").onclick=()=>study.mode==="section"?launchSectionPractice(study.topic):study.mode==="topic"?launchTopicPractice(study.topic):launchStudy(study.mode,study.level,study.topic);
 document.getElementById("studyHome").onclick=studyHome;
 const advance=document.getElementById("studyAdvance");if(advance)advance.onclick=()=>launchStudy("level",study.level+1,study.topic);
 if(window.ElektroAuth?.getUser())window.ElektroAuth.saveAttempt({score,total:selected.length,topic:"Tanulás: "+(study.mode==="path"?"Fokozatos":STUDY_LEVELS[study.level].name)+" / "+study.topic,answers:{...study.answers}}).then(()=>{const el=document.getElementById("studySaveStatus");if(el)el.textContent="A tanulási kör mentve a fiókodba."}).catch(e=>{const el=document.getElementById("studySaveStatus");if(el)el.textContent="Mentési hiba: "+e.message});
}

function studyConceptFor(q){
 if(q.id==="n2"||(/háromfázis|fázisfeszültség|vonali feszültség|fázis és.*nulla/i.test(q.q)&&/230|400/i.test(q.q)))return studyConcepts.lineVoltage;
 return null;
}
function studyConceptHtml(q){
 const c=studyConceptFor(q);
 if(!c)return "";
 return '<section class="lesson-example" aria-label="Kiemelt alapfogalmak"><h3>'+escaped(c.title)+'</h3>'+c.items.map(item=>'<p><strong>'+escaped(item.name)+': '+escaped(item.value)+'</strong><br>'+escaped(item.meaning)+'</p>').join('')+'<p class="muted">'+escaped(c.note)+'</p></section>';
}

function lessonKey(q){if(q.id==="os18"||/3G2,5|zöld.sárga védővezető eret/i.test(q.q))return "cableMarking";if(q.id==="os13"||/forgásirányát háromfázisú táplálás/i.test(q.q))return "rotation";if(q.id==="g3"||(/fűtőtest/i.test(q.q)&&/mennyi energiát|óra alatt/i.test(q.q)))return "energy";if(q.id==="g1"||/transzformátor alapvető működési elve/i.test(q.q))return "transformer";if(["os02","b2","os06"].includes(q.id)||/ÁVK|áram.védőkapcsoló/i.test(q.q))return "rcd";if(q.id==="n1"||/230 V.*46 Ω|Ohm.törvény alapján.*U.*R/i.test(q.q))return "ohm";if(q.id==="n3"||/Két 100 Ω.os ellenállást párhuzamosan/i.test(q.q))return "parallel";if(q.id.startsWith("fz")||/zárlat|rövidzárási|lökőáram|impedanciáj/i.test(q.q))return "short";if(q.topic.includes("gépek"))return "machine";if(q.topic.includes("biztonság"))return "safety";return "network"}
function renderLesson(q){
 const t=learningTopicOf(q);
 return '<section class="panel"><span class="pill">Kapcsolódó témakör</span><h1>'+escaped(t?.title||q.topic)+'</h1><p>'+escaped(t?.intro||q.intro)+'</p><h2>Az adott kérdés</h2><p>'+escaped(q.q)+'</p><p>'+escaped(q.why)+'</p><div class="lesson-example"><h2>Másik kidolgozott példa</h2><p>'+escaped(q.worked||t?.example||"")+'</p></div><p>'+escaped(q.real||"")+'</p><div class="actions"><button class="button" id="practiceLesson">Kapcsolódó feladatok</button><button class="button secondary" id="backResults">Vissza az értékeléshez</button></div></section>';
}
function showLesson(qid){const q=(state.examQuestions||BANK).find(item=>item.id===qid);if(!q)return;stopTimer();state.mode="lesson";app.innerHTML=renderLesson(q);document.getElementById("practiceLesson").onclick=()=>startReview(q.learningTopic);document.getElementById("backResults").onclick=()=>finish(true)}
function startReview(key){const questions=shuffled(BANK.filter(q=>q.learningTopic===key)).slice(0,5);stopTimer();state={mode:"exam",examQuestions:varyQuestions(questions),order:questions.map(q=>q.id),selectedIds:questions.map(q=>q.id),cursor:0,answers:{},skipped:[],second:false,deadline:Date.now()+45*60*1000,timer:null,topic:questions[0]?.topic||"Összes témakör"};state.timer=setInterval(tick,1000);render()}

function finish(fromLesson=false){stopTimer();state.mode="results";const selected=state.selectedIds.map(id=>(state.examQuestions||BANK).find(q=>q.id===id));const score=selected.reduce((sum,q)=>sum+(state.answers[q.id]===q.a?1:0),0);const user=window.ElektroAuth?.getUser();if(user&&!fromLesson)window.ElektroAuth.saveAttempt({score,total:selected.length,topic:state.topic,answers:{...state.answers}}).then(()=>{const el=document.getElementById('saveStatus');if(el)el.textContent='Az eredmény elmentve a tanulói fiókodba.'}).catch(e=>{const el=document.getElementById('saveStatus');if(el)el.textContent='Nem sikerült menteni az eredményt: '+e.message});const groups=[...new Set(selected.map(q=>q.topic))];app.innerHTML='<section class="panel"><span class="pill">Próba lezárva</span><h1>'+score+' / '+selected.length+' pont</h1><p class="muted">'+Math.round(score/selected.length*100)+'% helyes válasz. A meg nem válaszolt kérdések hibásnak számítanak. '+(user?'<span id="saveStatus">Eredmény mentése…</span>':'Vendégként nem mentjük el az eredményt.')+'</p><h2>Témakörönként</h2>'+groups.map(t=>{let qs=selected.filter(q=>q.topic===t);let good=qs.filter(q=>state.answers[q.id]===q.a).length;return '<p>'+escaped(t)+': <strong>'+good+'/'+qs.length+'</strong></p>'}).join('')+'<div class="actions"><button class="button" id="again">Új gyakorlás</button></div></section><section class="panel"><h2>Megoldások és magyarázatok</h2>'+selected.map((q,i)=>'<div class="answer"><p><strong>'+(i+1)+'. '+escaped(q.q)+'</strong></p><p class="muted small">'+escaped(q.source||"Alapozó mintafeladat")+'</p><p class="'+(state.answers[q.id]===q.a?"good":"bad")+'">Válaszod: '+(state.answers[q.id]===undefined?"kimaradt":displayedLetter(q,state.answers[q.id],state.optionOrders))+' · Helyes: '+displayedLetter(q,q.a,state.optionOrders)+'</p><p><mark>'+escaped(q.opts[q.a])+'</mark></p><p class="muted">'+escaped(q.why)+'</p>'+(state.answers[q.id]===q.a?'':'<button class="button secondary lesson-link" data-lesson="'+escaped(q.id)+'">Tanítócsomag megnyitása</button>')+'</div>').join('')+'</section>';document.getElementById("again").onclick=home;document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>showLesson(b.dataset.lesson))}
window.ElektroAuth?.init();window.ElektroAuth?.onChange(()=>{if(state.mode==='home'||state.mode==='login')home()});home();
</script></body></html>
