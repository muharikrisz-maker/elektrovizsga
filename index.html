<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>ElektroVizsga – erősáramú elektrotechnikus</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf1fb;background:#101827}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:22px 16px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:27px}.brand{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}.brand span{color:#6de2d0}.tag{font-size:.75rem;color:#b3c3d8;border:1px solid #46556a;border-radius:100px;padding:6px 10px}.panel{background:#192638;border:1px solid #34465e;border-radius:19px;padding:26px;margin:15px 0}.muted{color:#aec0d4}h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;margin:10px 0 18px}h2{line-height:1.3}p{line-height:1.6}.pill{display:inline-block;background:#203c45;color:#8be9d7;padding:6px 11px;border-radius:100px;font-size:.8rem}.button{background:#6de2d0;color:#0d2430;padding:13px 18px;border:0;border-radius:12px;font-weight:750;font-size:1rem;cursor:pointer}.button.secondary{background:#2b3b50;color:#eaf1fb}.button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.option{width:100%;text-align:left;display:flex;gap:15px;align-items:center;padding:16px;margin:10px 0;border:1px solid #40536a;background:#233247;color:#f0f6fc;border-radius:12px;font-size:1rem;cursor:pointer}.option strong{background:#364960;padding:8px 11px;border-radius:8px}.option.selected{border-color:#6de2d0;background:#235056}.progress{height:8px;background:#35465b;border-radius:8px;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:#6de2d0;transition:width .2s}.stats{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}.stat strong{display:block;font-size:1.2rem}.small{font-size:.88rem}.answer{border-top:1px solid #34465e;padding:16px 0}mark{background:#274c45;color:#a6f8e3;padding:2px 5px;border-radius:4px}.bad{color:#ffadab}.good{color:#8be9d7}footer{color:#95a9bf;font-size:.78rem;margin-top:28px}label{display:block;margin:10px 0}select{border:1px solid #536981;color:white;background:#26374b;border-radius:8px;padding:12px;font-size:1rem;max-width:100%}
</style></head><body><main><header><div class="brand">⚡ Elektro<span>Vizsga</span></div><div class="tag">DEMO • 1.0</div></header><div id="app"></div><footer>Gyakorlóalkalmazás, nem hivatalos vizsgafelület. A mintakérdések saját szerkesztésűek, nem OSZTV-feladatok.</footer></main>
<script>
"use strict";
const BANK=[
{id:"n1",topic:"Villamos hálózatok",q:"Egy 230 V feszültségre kapcsolt, 46 Ω ellenállású fogyasztón mekkora áram folyik?",opts:["0,2 A","5 A","10 A","46 A"],a:1,why:"Ohm törvénye alapján I = U/R = 230/46 = 5 A."},
{id:"n2",topic:"Villamos hálózatok",q:"Ideális, szimmetrikus háromfázisú 400/230 V hálózatban mekkora a fázisfeszültség?",opts:["230 V","400 V","690 V","133 V"],a:0,why:"Csillagkapcsolásban U_f = U_v/√3, így 400/√3 ≈ 230 V."},
{id:"n3",topic:"Villamos hálózatok",q:"Két 100 Ω-os ellenállást párhuzamosan kapcsolunk. Mennyi az eredő?",opts:["200 Ω","100 Ω","50 Ω","25 Ω"],a:2,why:"Két azonos ellenállás párhuzamos eredője R/2 = 50 Ω."},
{id:"g1",topic:"Villamos gépek és fogyasztók",q:"Mi a transzformátor alapvető működési elve?",opts:["Elektromágneses indukció","Elektrolízis","Termoelektromos hatás","Piezoelektromos hatás"],a:0,why:"A primer tekercs változó mágneses fluxusa feszültséget indukál a szekunder tekercsben."},
{id:"g2",topic:"Villamos gépek és fogyasztók",q:"Mit jelent az aszinkronmotor szlipje?",opts:["A forgórész és a forgómező fordulatszámának relatív eltérését","A névleges teljesítmény és a veszteség összegét","A fázisok közötti feszültséget","A motor tekercsének ohmos ellenállását"],a:0,why:"A szlip s = (n_s − n)/n_s, ahol n_s a szinkron, n a forgórész fordulatszáma."},
{id:"g3",topic:"Villamos gépek és fogyasztók",q:"Egy 2 kW teljesítményű, állandó teljesítményen üzemelő fűtőtest 3 óra alatt mennyi energiát fogyaszt?",opts:["0,67 kWh","5 kWh","6 kWh","9 kWh"],a:2,why:"E = P·t = 2 kW · 3 h = 6 kWh."},
{id:"b1",topic:"Villamos biztonságtechnika",q:"Milyen célra szolgál a PE-vezető?",opts:["Üzemi áram vezetésére normál üzemben","Védőösszekötésre és hibavédelmi célra","A feszültség frekvenciájának szabályozására","A fogyasztás mérésére"],a:1,why:"A PE védővezető, normál üzemben nem rendeltetésszerű üzemi áramvezető."},
{id:"b2",topic:"Villamos biztonságtechnika",q:"Mit érzékel az áram-védőkapcsoló (ÁVK) alapvetően?",opts:["A hálózati frekvencia eltérését","A fázisvezetők felmelegedését","Az átvezetett áramok előjeles összegének eltérését","A csatlakozó teljesítményt"],a:2,why:"Az ÁVK az átvezetett vezetők áramainak eredőjét figyeli: eltérő oda- és visszafolyó áram esetén működhet."},
{id:"b3",topic:"Villamos biztonságtechnika",q:"Melyik jelölés utal a védővezetőre villamos rajzon?",opts:["N","L1","PE","PEN kizárólag"],a:2,why:"A PE a védővezető; a PEN egyesített védő- és nullavezető."},
{id:"b4",topic:"Villamos biztonságtechnika",q:"Melyik eszköz alkalmas önmagában túláram elleni védelemre megfelelő méretezés esetén?",opts:["ÁVK túláramvédelem nélkül","Kismegszakító","Egyszerű kapcsoló","Jelzőlámpa"],a:1,why:"A kismegszakító túlterhelés és zárlati túláram ellen is véd; a szokásos ÁVK önmagában nem túláramvédelmi eszköz."}
];
const app=document.getElementById("app");
let state={mode:"home",order:[],cursor:0,answers:{},skipped:[],second:false,deadline:0,timer:null,topic:"Összes témakör"};
const escaped=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const storageKey="elektrovizsga-last-result";
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function home(){stopTimer();state.mode="home";const last=JSON.parse(localStorage.getItem(storageKey)||"null");app.innerHTML='<section class="panel"><span class="pill">Erősáramú elektrotechnikus</span><h1>Készülj a februári interaktív vizsgára!</h1><p class="muted">A–B–C–D válaszok, kérdésenként egyszeri átugrás, részletes kiértékelés. Ez a verzió 10 ellenőrzött, saját készítésű mintakérdést tartalmaz.</p><label for="topic">Gyakorlás témaköre</label><select id="topic"><option>Összes témakör</option>'+[...new Set(BANK.map(q=>q.topic))].map(t=>'<option>'+escaped(t)+'</option>').join('')+'</select><div class="actions"><button class="button" id="start">45 perces próba indítása</button></div></section>'+(last?'<section class="panel"><h2>Legutóbbi eredmény</h2><p><strong>'+last.score+'/'+last.total+'</strong> helyes válasz ('+Math.round(last.score/last.total*100)+'%)</p></section>':'');document.getElementById("start").onclick=()=>start(document.getElementById("topic").value)}
function start(topic){stopTimer();let order=BANK.filter(q=>topic==="Összes témakör"||q.topic===topic).map(q=>q.id);state={mode:"exam",order,cursor:0,answers:{},skipped:[],second:false,deadline:Date.now()+45*60*1000,timer:null,topic};state.timer=setInterval(tick,1000);render()}
function tick(){if(state.mode!=="exam")return;if(Date.now()>=state.deadline){finish();return}const el=document.getElementById("clock");if(el)el.textContent=clock()}
function clock(){const sec=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function current(){return BANK.find(q=>q.id===state.order[state.cursor])}
function render(){if(state.mode!=="exam")return;let q=current();if(!q){if(!state.second&&state.skipped.length){state.second=true;state.order=state.skipped.slice();state.cursor=0;q=current()}else{return finish()}}if(!q)return finish();const n=state.order.length;app.innerHTML='<section class="panel"><div class="stats"><div class="stat"><span class="muted small">'+(state.second?"Második kör":"Első kör")+'</span><strong>'+(state.cursor+1)+' / '+n+'</strong></div><div class="stat"><span class="muted small">Hátralévő idő</span><strong id="clock">'+clock()+'</strong></div></div><div class="progress"><div style="width:'+Math.round((state.cursor)/n*100)+'%"></div></div><span class="pill">'+escaped(q.topic)+'</span><h2>'+escaped(q.q)+'</h2><div id="options">'+q.opts.map((o,i)=>'<button class="option" data-a="'+i+'"><strong>'+String.fromCharCode(65+i)+'</strong><span>'+escaped(o)+'</span></button>').join('')+'</div><div class="actions"><button class="button secondary" id="skip" '+(state.second?"disabled":"")+'>Átugrom egyszer</button><button class="button secondary" id="end">Vizsga befejezése</button></div><p class="muted small">'+(state.second?"Ezeket a kérdéseket már nem lehet átugrani.":"Az átugrott kérdések a végén újra megjelennek.")+'</p></section>';document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(q.id,Number(b.dataset.a)));document.getElementById("skip").onclick=()=>skip(q.id);document.getElementById("end").onclick=()=>{if(confirm("Biztosan befejezed a próbavizsgát?"))finish()}}
function answer(id,a){state.answers[id]=a;state.cursor++;render()}
function skip(id){if(state.second)return;state.skipped.push(id);state.cursor++;render()}
function finish(){stopTimer();state.mode="results";const selected=state.second?BANK.filter(q=>state.answers[q.id]!==undefined&&state.order.includes(q.id)):BANK.filter(q=>state.topic==="Összes témakör"||q.topic===state.topic);const score=selected.reduce((sum,q)=>sum+(state.answers[q.id]===q.a?1:0),0);localStorage.setItem(storageKey,JSON.stringify({score,total:selected.length,date:new Date().toISOString()}));const groups=[...new Set(selected.map(q=>q.topic))];app.innerHTML='<section class="panel"><span class="pill">Próba lezárva</span><h1>'+score+' / '+selected.length+' pont</h1><p class="muted">'+Math.round(score/selected.length*100)+'% helyes válasz. A meg nem válaszolt kérdések hibásnak számítanak.</p><h2>Témakörönként</h2>'+groups.map(t=>{let qs=selected.filter(q=>q.topic===t);let good=qs.filter(q=>state.answers[q.id]===q.a).length;return '<p>'+escaped(t)+': <strong>'+good+'/'+qs.length+'</strong></p>'}).join('')+'<div class="actions"><button class="button" id="again">Új gyakorlás</button></div></section><section class="panel"><h2>Megoldások és magyarázatok</h2>'+selected.map((q,i)=>'<div class="answer"><p><strong>'+(i+1)+'. '+escaped(q.q)+'</strong></p><p class="'+(state.answers[q.id]===q.a?"good":"bad")+'">Válaszod: '+(state.answers[q.id]===undefined?"kimaradt":String.fromCharCode(65+state.answers[q.id]))+' · Helyes: '+String.fromCharCode(65+q.a)+'</p><p><mark>'+escaped(q.opts[q.a])+'</mark></p><p class="muted">'+escaped(q.why)+'</p></div>').join('')+'</section>';document.getElementById("again").onclick=home}
home();
</script></body></html>
